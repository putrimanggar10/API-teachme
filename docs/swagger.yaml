basePath: /
definitions:
  internal_delivery_http.assignClassInput:
    properties:
      class_id:
        type: string
      subject_id:
        type: string
    type: object
  internal_delivery_http.createAccountInput:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  internal_delivery_http.createClassInput:
    properties:
      academic_year:
        example: 2026/2027
        type: string
      grade:
        example: "8"
        type: string
      name:
        example: Class 8C
        type: string
    type: object
  internal_delivery_http.createSubjectInput:
    properties:
      name:
        type: string
    type: object
  internal_delivery_http.loginInput:
    properties:
      account_id:
        type: string
      class_id:
        type: string
      password:
        type: string
      subject_id:
        type: string
    required:
    - account_id
    - class_id
    - password
    - subject_id
    type: object
  internal_delivery_http.refreshInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_delivery_http.setLanguageInput:
    properties:
      language:
        example: en
        type: string
    type: object
  internal_delivery_http.startSessionInput:
    properties:
      class_id:
        type: string
    required:
    - class_id
    type: object
info:
  contact: {}
  description: 'Backend TeachMe (class board). Milestone F01: Auth, Pilih Kelas, Sesi
    + Code/QR. Gin + PostgreSQL, Clean Architecture.'
  title: TeachMe API
  version: "0.1"
paths:
  /api/v1/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Daftar guru untuk dropdown "pilih nama" di layar login (publik)
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: nama + password guru baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.createAccountInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Tambah guru baru (halaman "Kelola Akun", publik)
      tags:
      - Accounts
  /api/v1/accounts/{id}/classes:
    get:
      description: Tiap item = 1 pasangan mapel+kelas, mis. label "Math · Class 7B".
        Kirim class_id + subject_id-nya saat login.
      parameters:
      - description: ID guru (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Pilihan "Mapel · Kelas" seorang guru (dropdown "Class" saat login,
        publik)
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      description: Setelah ini guru bisa login memilih "Mapel · Kelas" tsb. Aman dipanggil
        berulang (tidak dobel).
      parameters:
      - description: ID guru (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: kelas + mapel yang ditugaskan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.assignClassInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Tugaskan guru mengajar mapel di kelas (halaman "Manage accounts & classes",
        publik)
      tags:
      - Accounts
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: username & password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.loginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login (guru/siswa) -> access + refresh token
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.refreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Tukar refresh token dengan access token baru
      tags:
      - Auth
  /api/v1/classes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Daftar kelas yang boleh diajar guru (untuk layar "pilih kelas")
      tags:
      - Classes
  /api/v1/classes/{id}/roster:
    get:
      parameters:
      - description: ID kelas (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Daftar siswa pada sebuah kelas (khusus guru pengampu)
      tags:
      - Classes
  /api/v1/languages:
    get:
      description: Urut seperti di layar. Tampilkan `name` sebagai judul dan `english_name`
        sebagai keterangan kecil.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Daftar bahasa papan (layar "Choose board language", publik)
      tags:
      - Languages
  /api/v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Profil pengguna yang sedang login
      tags:
      - Auth
  /api/v1/me/language:
    put:
      consumes:
      - application/json
      description: Dipanggil saat menekan "Continue". Pilihan ini ikut terkirim saat
        login berikutnya (user.preferred_language).
      parameters:
      - description: 'kode bahasa: id, en, zh, es, ar'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.setLanguageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Simpan bahasa papan pilihan pengguna yang sedang login
      tags:
      - Languages
  /api/v1/school-classes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Semua kelas di sekolah (halaman "Manage accounts & classes", publik)
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: nama kelas (wajib), tingkat & tahun ajaran (opsional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.createClassInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: nama kelas sudah ada
          schema:
            additionalProperties: true
            type: object
      summary: Tambah kelas baru (halaman "Manage accounts & classes", publik)
      tags:
      - Accounts
  /api/v1/sessions:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID kelas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.startSessionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mulai sesi kelas -> hasilkan join_code + qr_payload
      tags:
      - Sessions
  /api/v1/sessions/{id}:
    get:
      parameters:
      - description: ID sesi (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Info sesi
      tags:
      - Sessions
  /api/v1/sessions/{id}/end:
    post:
      parameters:
      - description: ID sesi (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Akhiri sesi (kode jadi tidak berlaku)
      tags:
      - Sessions
  /api/v1/sessions/{id}/qr:
    get:
      parameters:
      - description: ID sesi (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Gambar QR untuk bergabung ke sesi (PNG)
      tags:
      - Sessions
  /api/v1/subjects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Daftar mata pelajaran (halaman "Manage accounts & classes", publik)
      tags:
      - Subjects
    post:
      consumes:
      - application/json
      parameters:
      - description: nama mapel, mis. Math
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.createSubjectInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: nama mapel sudah ada
          schema:
            additionalProperties: true
            type: object
      summary: Tambah mata pelajaran (halaman "Manage accounts & classes", publik)
      tags:
      - Subjects
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
